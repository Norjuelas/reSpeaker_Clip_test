name: firmware

# Compilation check for the Clip firmware (Zephyr / NCS v3.3.0). Uses nrfutil
# toolchain-manager to install the NCS + toolchain, applies the MCUboot patches,
# and west builds clip/nrf5340/cpuapp (sysbuild: MCUboot + app + ipc-radio).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build clip app (NCS v3.3.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this module
        uses: actions/checkout@v4
        with:
          path: respeaker_clip

      - name: Install nrfutil
        run: |
          curl -sSfL https://github.com/NordicSemiconductor/pc-nrfutil/releases/download/v6.1.7/nrfutil-linux -o nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/
          nrfutil self-upgrade || true
          nrfutil install toolchain-manager
          nrfutil --version

      - name: Install NCS v3.3.0 (source + toolchain)
        run: nrfutil toolchain-manager install --ncs-version v3.3.0

      - name: Apply MCUboot patches (idempotent)
        run: |
          cd ~/ncs/bootloader/mcuboot
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/respeaker_clip/patches/mcuboot/0*.patch; do
            if git apply --check "$p" 2>/dev/null; then
              echo "applying $(basename "$p")"
              git apply "$p"
            else
              echo "skip (already applied): $(basename "$p")"
            fi
          done

      - name: Build clip app
        run: |
          nrfutil toolchain-manager launch --shell --ncs-version v3.3.0 --command \
            "export ZEPHYR_EXTRA_MODULES=$GITHUB_WORKSPACE/respeaker_clip && \
             west build -b clip/nrf5340/cpuapp \
             $GITHUB_WORKSPACE/respeaker_clip/applications/clip \
             --build-dir build"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-build
          path: |
            build/clip/zephyr/zephyr.elf
            build/merged.hex
          if-no-files-found: ignore
