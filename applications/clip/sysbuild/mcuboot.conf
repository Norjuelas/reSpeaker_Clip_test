#
# MCUboot configuration for the bootloader image
#
# These settings configure MCUboot's behavior when running as the bootloader.
# This configuration supports external SPI Flash (PY25Q64H on SPI3) for DFU.

# Increase max image sectors to support larger firmware images
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Enable SPI NOR flash support for external flash (SPI3, not QSPI)
# The PY25Q64H is connected via SPI3 with jedec-id = [ 85 20 17 ]
CONFIG_SPI_NOR=y

# Disable unnecessary drivers for MCUboot (reduce size and avoid link errors)
CONFIG_DISPLAY=y
CONFIG_INPUT=n

# I2C for OLED display only (no NPM1300)
CONFIG_I2C=y

# Custom mcumgr per-user commands (erase SD, erase settings)
CONFIG_ENABLE_MGMT_PERUSER=y

# SD card access for erase command
CONFIG_DISK_ACCESS=y
CONFIG_SPI_SDHC=y

# OLED display in MCUboot (shows DFU Mode, Error, etc.)
CONFIG_MCUBOOT_DISPLAY=y
CONFIG_MCUBOOT_ACTION_HOOKS=y

# Keep GPIO enabled for button support (serial recovery)
CONFIG_GPIO=y

# Keep SPI enabled for external flash access
CONFIG_SPI=y

# ==============================================================================
# Logging & Console -- disabled to reduce boot power
# ==============================================================================
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ==============================================================================
# USB CDC Serial Recovery
# ==============================================================================
# Triggered by app calling boot_mode_set(BOOT_MODE_TYPE_BOOTLOADER) + reboot.
# Use: mcumgr --conntype serial --connstring /dev/ttyACM0,baud=115200 image upload ...
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="Seeed Technology"
CONFIG_USB_DEVICE_PRODUCT="ReSpeaker Clip DFU"
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x8070
# USB requires multithreading
CONFIG_MULTITHREADING=y
# Enter serial recovery via retention boot mode (set by application before reboot)
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
