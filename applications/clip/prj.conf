# SPDX-License-Identifier: Apache-2.0
#
# Clip Application Configuration
# Refactored version with modular architecture
#

# ==============================================================================
# FPU + CMSIS-DSP
# ==============================================================================
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CMSIS_DSP=y

# ==============================================================================
# Logging Configuration
# ==============================================================================
CONFIG_LOG=y
CONFIG_ASSERT=n
CONFIG_CLIP_LOG_LEVEL_WRN=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD=y

# FS log backend (SD card /SD:/LOG/)
# Boot-time logs to the card even under the production snippet. The nRF70 patch
# provisioning runs during startup, and with the FS backend off by default its
# outcome was invisible — AT+LOG=debug only takes effect once boot is over.
#
# Este =y explicito gana al `default y if LOG_BACKEND_UART` del Kconfig, asi que
# tambien aplica a produccion. Eso tenia una consecuencia que nadie habia
# atado: con el backend encendido, clip_sd_busy() es true y la secuencia de
# apagado de la tarjeta no se ejecutaba en NINGUNA build. La ventana de abajo
# resuelve las dos intenciones — se ve el arranque, y luego el backend se
# retira solo. AT+LOG=info lo vuelve a encender y cancela la retirada.
CONFIG_CLIP_LOG_FS_DEFAULT_ON=y
CONFIG_CLIP_LOG_FS_BOOT_WINDOW_S=120

CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/SD:/LOG"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log."
CONFIG_LOG_BACKEND_FS_FILE_SIZE=131072
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=20
CONFIG_LOG_BACKEND_FS_OVERWRITE=y
CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE=y

# Minimize log output overhead
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_PRINTK=n

# Disable validation features to save flash
CONFIG_SPIN_VALIDATE=n
CONFIG_MEM_SLAB_POINTER_VALIDATE=n

# ==============================================================================
# Main Stack and Heap
# ==============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_CLIP_AT_SERVER_STACK_SIZE=8192
CONFIG_CLIP_TRANSFER_STACK_SIZE=4096
CONFIG_CLIP_UDP_THREAD_STACK_SIZE=2048

# ==============================================================================
# Reboot Support
# ==============================================================================
CONFIG_REBOOT=y

# ==============================================================================
# Power Management (System ON Idle)
# ==============================================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y

# ==============================================================================
# Thread Monitoring (disabled to save ~20KB flash)
# ==============================================================================
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n
# Rellena las pilas al arrancar para poder medir cuanta se usa de verdad. En
# este firmware los tamanos de pila se han elegido a ojo tres veces y las tres
# reventaron; mientras siga en movimiento, el dato vale mas que el criterio.
# Lo lee AT+HTTPUP? en el campo stack_free.
#
# Se apago cuando ya habia cumplido -- sabemos que el hilo de subida usa ~7KB de
# 14KB -- dejando escrito que se volviera a encender cuando hiciera falta medir
# otra pila. Ese momento es ahora: la campana de bateria cambia firmware una y
# otra vez, y con esto apagado stack_free reporta 0 en produccion, que es peor
# que no reportarlo (parece medido y no lo esta).
#
# Cuesta FLASH sobre una imagen al ~97%. Medir el delta con `rom_report` antes y
# despues, y volver a apagarlo al cerrar la campana.
CONFIG_INIT_STACKS=y
# ON while the firmware is in motion. A blown stack with this off corrupts
# memory silently — that is what killed the device ~25s into every WiFi
# association attempt and cost four wrong hypotheses (regulatory domain, 5GHz
# band, DHCP, net_if_down) before the culprit turned out to be a 2KB stack on a
# thread that descends into the WPA supplicant. Costs a little flash and turns
# an afternoon of guessing into one log line. Revisit before shipping.
CONFIG_STACK_SENTINEL=y
# El latido reporta el heap libre: en una jornada de 8 horas es donde se veria
# una fuga, y una fuga lenta no se nota hasta que el device deja de subir.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# DWT cycle counter for precise timing measurement
CONFIG_CORTEX_M_DWT=y

# Debug stats (thread stack + heap usage)
CONFIG_CLIP_DEBUG_STATS=n

# ==============================================================================
# Retention subsystem for MCUboot USB DFU mode trigger
# ==============================================================================
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# ==============================================================================
# Bluetooth BLE — APAGADO POR DEFECTO (postura de seguridad)
# ==============================================================================
# Estaba encendido aqui y se apagaba en overlay-tls.conf, un overlay que habia
# que pasar a mano (fichero ya borrado, 2026-08-25).
# El resultado era que build-prod y build-relcheck-prod salieron CON la radio
# BLE dentro, mientras la documentacion de seguridad afirmaba lo contrario.
# La postura segura tiene que ser la que sale sin argumentos extra; la
# insegura, la que hay que pedir (overlay-dev-radio.conf).
#
# El motivo no es la FLASH: el device solo debe poder manipularse por cable o
# por WiFi con las metodologias aprobadas, y un canal de radio sin autenticar
# es superficie de ataque en 100 devices desplegados.
#
# Se pierde el canal AT por BLE y con el las SDKs moviles de mobile/, y el OTA
# por Bluetooth. Reversible con overlay-dev-radio.conf (los stubs estan en
# src/ble_stub.c y no hay que tocar ningun sitio de llamada).
CONFIG_BT=n

# El host BT arrastraba el soporte de pares de claves ECC, y ECDHE-ECDSA
# dependia de el sin que se notara. Al sacar BT, mbedTLS falla con "not all
# prerequisites": se piden explicitamente.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# El OTA por BLE se va con BLE.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=n
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=n
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=n

# Lo que sigue solo aplica si overlay-dev-radio.conf vuelve a poner CONFIG_BT=y.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Clip"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1

# BLE throughput optimization
CONFIG_BT_BUF_ACL_RX_SIZE=517
CONFIG_BT_BUF_ACL_TX_SIZE=517
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_RX_STACK_SIZE=4096

# BLE Pairing & Bonding
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
# Debug: a new phone may pair and overwrite the single stored bond without
# first clearing it (convenient for testing). Production turns this OFF in
# snippets/production/snippet-production.conf so the device stays locked to
# its owner until an explicit AT+PAIR=reset.
# Kept ON even under the production snippet, which sets it to n: a reflash can
# leave the phone/host holding a bond the device no longer has, and macOS then
# refuses to connect with "Peer removed pairing information" — locking us out of
# the only AT channel. Revisit before shipping.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_ASSERT_VERBOSE=n

# ==============================================================================
# GPIO and Regulators
# ==============================================================================
CONFIG_GPIO=y
CONFIG_REGULATOR=y

# Custom GPIO button driver
CONFIG_GPIO_BUTTON=y
CONFIG_INPUT_GPIO_BUTTON_OWN_THREAD=y
CONFIG_INPUT_GPIO_BUTTON_THREAD_STACK_SIZE=512
CONFIG_INPUT_GPIO_BUTTON_THREAD_PRIORITY=5

# Haptic motor control
CONFIG_CLIP_HAPTIC_MOTOR_ENABLED=y

# Display
CONFIG_DISPLAY=y

# I2C for PMIC and Display
CONFIG_I2C=y

# MFD and npm1300 charger/fuel-gauge sensor (required for SD card power)
CONFIG_MFD=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y

# Nordic nRF Fuel Gauge Library for accurate battery SoC estimation
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# BLE Battery Service
CONFIG_BT_BAS=y
CONFIG_BT_BAS_BLS=y
CONFIG_BT_BAS_BLS_BATTERY_LEVEL_PRESENT=y
CONFIG_BT_BAS_BLS_ADDITIONAL_STATUS_PRESENT=y

# ==============================================================================
# Settings and Storage
# ==============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y

# File Systems
CONFIG_FILE_SYSTEM=y

# LittleFS for settings
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=4096
CONFIG_FS_LITTLEFS_NUM_FILES=16
CONFIG_FS_LITTLEFS_NUM_DIRS=4

# FATFS for SD card
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings/run"
CONFIG_SETTINGS_FILE_MAX_LINES=16

# ==============================================================================
# Bluetooth OTA DFU (MCUmgr) - App core + Network core
# ==============================================================================
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_GRP_IMG_UPDATABLE_IMAGE_NUMBER=2
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# Boot-time WiFi join is OFF: bringing the radio up takes the device down about
# 10s into every boot (USB disappears entirely). Under investigation — suspected
# brownout on a half-drained battery, or the nRF70 heaps not fitting. Use
# AT+STA=on by hand until that is understood.
# Autoconnect al arranque: APAGADO desde que existe CLIP_WIFI_ON_DEMAND.
#
# El motivo por el que estaba en 'y' sigue siendo cierto y hay que respetarlo:
# en tienda nadie va a teclear AT+STA=on tras cada reinicio, y un device sin
# red esta mudo y parece apagado en el panel. Lo que cambia es QUIEN resuelve
# eso. Ya no el arranque, sino la ventana periodica de subida, que sube la
# radio cada CLIP_UPLOAD_INTERVAL_MIN, manda el latido haya o no ficheros
# pendientes, y la vuelve a bajar. La visibilidad de flota se conserva; lo que
# se deja de pagar es tener la radio asociada las 24 horas.
#
# Ojo: este es el simbolo que anula el ahorro si se vuelve a poner en 'y'. Una
# asignacion explicita en prj.conf gana al `default n if CLIP_WIFI_ON_DEMAND`
# del Kconfig, asi que ponerlo aqui deja la radio arriba desde el arranque y el
# resto del mecanismo no sirve de nada.
CONFIG_CLIP_STA_AUTOCONNECT=n

# Development: expose the AT command channel over USB from boot, so the device
# stays reachable without BLE. See CLIP_USB_AT_AT_BOOT for why this matters.
CONFIG_CLIP_USB_AT_AT_BOOT=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# ==============================================================================
# Flash Size Optimization (-Oz)
# ==============================================================================
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y

# Link Time Optimization
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# ==============================================================================
# Audio Configuration (DMIC + Opus + SpeexDSP)
# ==============================================================================
CONFIG_CLIP_AUDIO_ENABLED=y

# DMIC (PDM Microphone)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Opus Codec
CONFIG_OPUS_CODEC=y

# SpeexDSP for audio preprocessing (noise suppression, AGC, dereverb)
# Only used in enhanced/merge mode, not in stereo mode
CONFIG_SPEEXDSP=y

# Thread stack for audio (needs more space for Opus encoding)
CONFIG_CLIP_AUDIO_STACK_SIZE=32768
CONFIG_CLIP_AUDIO_THREAD_PRIORITY=0

# =============================================================================
# Audio Segment Duration (configured via Kconfig, not hardcoded here)
# Use CLIP_AUDIO_SEGMENT_DURATION_SYNC and CLIP_AUDIO_SEGMENT_DURATION_NO_SYNC
# from Kconfig to set these values (default: 60s and 300s)
# =============================================================================
CONFIG_CLIP_AUDIO_SEGMENT_DURATION_SYNC=60
CONFIG_CLIP_AUDIO_SEGMENT_DURATION_NO_SYNC=300

CONFIG_CLIP_STORAGE_FILES_PER_GROUP=100

# ==============================================================================
# WiFi AP Configuration
# ==============================================================================
# nRF7002 firmware patch read from the nrf70_fw_partition in external flash
# instead of being linked into this image (~87KB saved). Streamed to the nRF70
# in 8KB chunks at WiFi init, so only a transient 2x8KB heap cost remains.
#
# The partition is NOT an MCUboot image — the deployed bootloader only handles
# two and cannot be replaced without SWD. nrf70_fw_provision.c writes the
# partition from the SD card when it is empty or fails its hash check.
CONFIG_NRF_WIFI_PATCHES_EXT_FLASH_STORE=y
CONFIG_NRF_WIFI_FW_FLASH_CHUNK_SIZE=8192
# ==============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
# El modo punto de acceso, fuera por la misma razon que BLE: levantaba un SSID
# con contrasena identica en las 100 unidades. Solo se usaba para transferir
# audio a un telefono, que es justo lo que sustituye la subida por WiFi.
CONFIG_NRF70_AP_MODE=n

# WiFi/BLE coexistence: MPSL_CX=y on net core + NRF70_SR_COEX=y on app core.
# NRF70_SR_COEX_RF_SWITCH is NOT enabled (no RF switch hardware on this board).
CONFIG_NRF70_SR_COEX=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
# Suppress WPA supplicant log strings (saves ~10KB flash)
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_ERR=y
# Disable WPA3/SAE — device uses WPA2-PSK only (saves ~23KB flash)
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_NONE=y

# Station mode, for joining an existing network (BPIN uploads).
# The STA infrastructure was always being compiled — the AP code depends on it —
# so flipping this on costs 96 bytes of FLASH and zero RAM (measured).
# AP and STA are mutually exclusive at runtime: NET_IF_UNICAST_IPV4_ADDR_COUNT=1
# allows a single IPv4 address per interface.
CONFIG_NRF70_STA_MODE=y

# Crypto: SHA512/DHM disable caused sta_set_flags errors, keep enabled for now
# CONFIG_MBEDTLS_SHA512_C=n
# CONFIG_MBEDTLS_SHA384_C=n
# CONFIG_MBEDTLS_DHM_C=n
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# WiFi ready callback library (for runtime net_if_up)
CONFIG_WIFI_READY_LIB=y

# WiFi driver manual start (user must call net_if_up before AP mode)
# This saves ~30mA when WiFi is not in use.
CONFIG_NRF_WIFI_IF_AUTO_START=n

# QSPI low power mode (saves ~0.1-0.3mA when WiFi is off)
# The nRF70 driver logs are compiled out by LOG_DEFAULT_LEVEL=0, so a failure
# to load the firmware patch produced no message at all — the only symptom was
# net_if_up() returning -EIO. Errors only; the driver is chatty at INF.
CONFIG_WIFI_NRF70_LOG_LEVEL_ERR=y

CONFIG_NRF70_QSPI_LOW_POWER=y

# Minimal networking stack (IPv4 + UDP + DHCP, no IPv6/TCP)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# HTTP upload path. TCP is off by default in this project ("minimal networking
# stack"); the HTTP client needs it. TLS comes later — see Doc 12 for the fleet
# CA and mTLS plan. Plain HTTP is for the concept test only, never for devices
# in the field carrying conversation audio.
CONFIG_NET_TCP=y
CONFIG_HTTP_CLIENT=y

CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_LOG=n

# AP static IP
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.4.1"

CONFIG_MBEDTLS_HEAP_SIZE=1024


# Minimal WiFi buffer sizes (tune for RAM/flash balance)
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=16384
CONFIG_CLIP_UDP_SOCKET_BUF_SIZE=4096
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=4
# Sized for station mode, not for an AP serving clients: one peer, traffic mostly
# outbound. The AP-era values (20000/40000) left RAM at 99% once TLS was added;
# these bring it to 94% and are what makes HTTPS fit at all. Watch for transfers
# that stall under sustained load if these go lower.
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=12000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=20000

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

CONFIG_NRF70_IRQ_WQ_STACK_SIZE=1024

CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=2048

# Required by WPA supplicant
CONFIG_POSIX_TIMERS=y
CONFIG_ENTROPY_GENERATOR=y

# Hardware info for SSID generation from chip ID
CONFIG_HWINFO=y

# ==============================================================================
# USB - CDC ACM (AT command serial) + MSC (SD card, on demand)
# ==============================================================================
CONFIG_USB_DEVICE_STACK_NEXT=y

# 1200-baud USB CDC -> mcuboot DFU trigger (hook is on via the board default
# CONFIG_CLIP_USB_DFU=y). The clip app brings its own BLE-gated CDC+MSC, so
# disable the module's default CDC (which is for apps without a USB stack).
CONFIG_CLIP_USB_DFU_DEFAULT_CDC=n

# CDC ACM (virtual serial port for AT commands)
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# MSC (Mass Storage, enabled via AT+MSC=on)
# La microSD se expone como unidad, y es una exposicion real: la carcasa es
# cerrada y la tarjeta no se saca, asi que MSC es LA via para llevarse todos
# los audios con solo un cable.
#
# Sigue encendido porque apagarlo ahora nos deja ciegos sin protegernos. Con la
# carcasa cerrada, MSC es el unico acceso fisico a la tarjeta: sin el, el log
# de /SD:/LOG es ilegible para siempre (AT+DOWNLOAD baja sesiones, no logs),
# nrf70.bin no se puede provisionar, y no queda via de rescate si la red falla.
#
# El orden correcto es cifrar primero y cerrar MSC despues. Con el audio
# cifrado en reposo (Doc 09, claves compartidas entre nube y device), que
# alguien monte la tarjeta deja de importar.
CONFIG_CLIP_USB_MSC=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_DOUBLE_BUFFERING=n
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512
CONFIG_USBD_MSC_STACK_SIZE=1024

# ==============================================================================
# TLS — INCORPORADO DESDE overlay-tls.conf (2026-08-18; overlay borrado 2026-08-25)
# ==============================================================================
# Estaba en un overlay que se pasaba a mano con -DEXTRA_CONF_FILE. Consecuencia
# comprobada: build-prod y build-relcheck-prod salieron SIN TLS y CON BLE y modo
# AP, mientras la documentacion de seguridad afirmaba lo contrario.
#
# Va aqui, y al final del fichero a proposito: el overlay se aplicaba DESPUES de
# prj.conf, asi que manteniendo el orden se conserva que estos valores ganen a
# los de mas arriba. Mover cualquiera de estas lineas hacia arriba puede
# cambiar el binario en silencio.
#
# Para desarrollo con BLE o modo AP: overlay-dev-radio.conf.

# TLS recortado al mínimo que sirve para hablar con nuestro propio servicio.
#
# Esto NO es una config de propósito general: sólo negocia con un servidor que
# controlamos nosotros, así que se puede tirar todo lo que existe por
# compatibilidad con la web pública. Con la FLASH al 97% no hay otra opción —
# un TLS por defecto cuesta ~45KB y sólo quedan ~27KB.
#
# La criptografía ya estaba compilada: el supplicant WPA2 arrastra PSA con ECC,
# AES y SHA-256. Lo que se añade aquí es la capa de protocolo, no los algoritmos.

CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_X509_LIBRARY=y
CONFIG_MBEDTLS_SSL_CLI_C=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# Somos cliente y nada mas. El lado servidor entra por defecto y no lo usamos.
CONFIG_MBEDTLS_SSL_SRV_C=n

# Un solo intercambio de claves. ECDHE-ECDSA con P-256: sin RSA en ninguna
# parte, que es lo que más pesa en X.509 y en el handshake.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

# LA PIEZA QUE FALTABA, aprendida del sample https_client de NCS: los simbolos
# legacy de mbedTLS (ECDH_C, ECDSA_C) NO se derivan de los PSA_WANT_* en esta
# configuracion, y sin ellos la tabla de OIDs de firma y los supported_groups
# del ClientHello quedan vacios — el saludo sale sin ningun conjunto de cifrado
# utilizable y el servidor responde 'no shared cipher' (en el device: -0x7780).
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# 4KB por sentido en vez de los 16KB por defecto: 24KB de RAM que no tenemos.
# Obliga al servidor a no mandar registros mayores; el nuestro obedece.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# Nada de reanudación de sesión ni SNI: un solo servidor, siempre el mismo.
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=n

# El handshake pide bastante más montón que los 1024 bytes que bastaban para
# la criptografía suelta del supplicant.
CONFIG_MBEDTLS_HEAP_SIZE=16384

# --- Segundo recorte, tras medir -------------------------------------------
# La primera medición desbordó por 17 688 B. El diff contra el build base
# reveló que Kconfig había metido por defecto un montón de cosas que no
# usamos. Nada de esto hace falta para hablar con nuestro propio servicio.

# Tres intercambios de claves PSK que no negociamos jamás.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA_ENABLED=n
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=n

# Listas de revocación y peticiones de firma: el device sólo valida una cadena
# que ya lleva embebida. No parsea CRLs ni emite CSRs.
CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_PARSE_C=n

# Guardar y restaurar sesiones TLS entre reinicios: no lo usamos.
CONFIG_MBEDTLS_SSL_CONTEXT_SERIALIZATION=n

# Conservar el certificado del servidor tras el handshake: sólo sirve para
# inspeccionarlo después, cosa que no hacemos.
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n

# Exportar el material de claves (para descifrar capturas). Fuera.
CONFIG_MBEDTLS_SSL_EXPORT_KEYS=n

# El texto de cada alerta posible. (encrypt-then-MAC no se puede desactivar:
# Kconfig no lo expone, lo fija la librería.)
CONFIG_MBEDTLS_SSL_ALL_ALERT_MESSAGES=n
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=n

# Un solo conjunto de cifrado a ofrecer.
CONFIG_NET_SOCKETS_TLS_MAX_CIPHERSUITES=2

CONFIG_CLIP_UPLOAD_TLS=y

# Sin esto el device no sabe decodificar un certificado PEM. Y el fallo no lo
# dice: mbedTLS no parsea el certificado, setsockopt(TLS_SEC_TAG_LIST) devuelve
# EINVAL, y connect() acaba dando EHOSTUNREACH — un error de red para un
# problema de formato de fichero. Costo un rato de diagnostico.
#
# Son ~2KB. La alternativa era exigir DER, que el codigo tambien acepta, pero
# PEM es lo que sale de openssl y lo que cualquiera tiene a mano.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# La capa de cifrado de mbedTLS. Solo se activa sola con la criptografia legacy,
# que aqui no se usa — con PSA hay que pedirla a mano.
#
# Sin ella el ClientHello sale SIN NINGUN conjunto de cifrado: el servidor
# responde 'no shared cipher' y manda una alerta fatal, que en el device
# aparece como -0x7780 y, mas arriba, como un connect() fallido. Se probaron
# tres redes distintas buscando un problema de conectividad que no existia.
CONFIG_MBEDTLS_CIPHER_C=y

# AES y GCM NO se piden a mano: los aporta PSA por hardware (CryptoCell), y
# mbedTLS los ve via MBEDTLS_SSL_HAVE_GCM, que se deriva de PSA_WANT_ALG_GCM.
# Forzar AES_C/GCM_C duplica en software lo que el acelerador ya hace (~4KB de
# FLASH para nada). Verificado linea a linea contra el sample https_client de
# NCS compilado para esta placa, que funciona sin ellos.

# --- WiFi: power-save + recuperacion del RPU (T2.2.3) -------------------------
# HISTORIA. Al quitar el modo AP, NRF_WIFI_LOW_POWER pasa a 'y' por defecto y
# arrastra RPU_PS_IDLE_TIMEOUT_MS=10: el RPU se duerme a los 10 ms de inactividad
# incluso en mitad de la asociacion. Todos los builds que "no asociaban en
# silencio" tenian el AP fuera y este simbolo dentro. Se apago el power-save
# entero para tapar eso, y se dejo escrito que se recuperaria "despues, a
# proposito y medido". Este es ese despues.
#
# LO QUE COSTO tenerlo apagado, visto en el log de la tarjeta: el driver del
# nRF70 trae un mecanismo de RECUPERACION que reinicia la interfaz (cold boot
# del RPU) cuando el RPU se cuelga -- y ese mecanismo DEPENDE de
# NRF_WIFI_LOW_POWER. Con el power-save apagado tambien estaba apagada la
# recuperacion. Resultado: cuando el RPU se colgaba (rafagas de "hal_rpu_msg_write:
# Invalid memory address 0xAAAAAAAA", precedidas de "SIGNAL_POLL command timed
# out"), no se recuperaba en toda la vida del arranque. Una sesion de 23 ficheros
# / 22 MB fallo seis veces seguidas con ETIMEDOUT y nunca subio. El workaround de
# bateria estaba causando el fallo de subida.
#
# EL CAMBIO. Se reactiva el power-save, y con el aparece RPU_RECOVERY (default y).
# El timeout de reposo se sube de 10 ms a 100 ms: 10 ms dormia el radio en los
# huecos del 4-way handshake -- ese era el bug de asociacion original -- y 100 ms
# cubre esos huecos de sobra sin renunciar a dormir rapido cuando de verdad no
# hay trafico. Es la perilla a ajustar si la asociacion vuelve a fallar.
#
# GATE OBLIGATORIO antes de dar esto por bueno: asociar diez veces seguidas
# desde arranque en frio, sin un solo fallo. Es el bug por el que se apago, y
# solo hardware lo confirma. RPU_RECOVERY_DEBUG queda ENCENDIDO para esa prueba,
# para ver la recuperacion dispararse en el log; se apaga al cerrar el gate
# (ruido en el log de produccion).
# VEREDICTO 2026-09-03, con A/B controlado sobre hardware: el power-save del RPU
# ROMPE la asociacion en esta placa, y la recuperacion del driver no la rescata.
# Se queda apagado. Ya no es una sospecha heredada de un comentario: hay numeros.
#
#   Brazo A, LOW_POWER=n   -> 10/10 asociaciones, 10,3 s cada una, RSSI -49
#   Brazo B, LOW_POWER=y   -> 0/12 (dos tandas: 0/7 y 0/5)
#
# Mismo cable, mismo AP, una detras de otra, e imagenes que solo se diferencian
# en este grupo de simbolos (el brazo A se construyo con un EXTRA_CONF_FILE que
# apaga solo estos, para que cualquier diferencia fuera atribuible). El device
# no se reinicio en ninguno de los dos brazos.
#
# MECANISMO, del log de la tarjeta en el brazo B:
#   nrf_wifi_rpu_recovery_work_handler: Starting RPU recovery
#   nrf_wifi_rpu_recovery_work_handler: Bringing the interface down
#   nrf_wifi_rpu_recovery_work_handler: rpu_ctx_zep is NULL
#   nrf_wifi_rpu_recovery_bringup_work_handler: net_if_up failed: -120
#   wifi: STA association to 'APTO11-2G' failed (reason: timeout, no result event)
#
# -120 es EALREADY: la recuperacion intenta levantar una interfaz que ya esta
# arriba mientras su propio contexto (rpu_ctx_zep) es NULL. Se pierde en su
# propio estado, tira la interfaz y no sabe reconstruirla. O sea que
# NRF_WIFI_RPU_RECOVERY, que era el motivo para querer el power-save (es su
# unica dependencia), tampoco funciona tal cual en esta placa.
#
# Consecuencia que hay que aceptar: el cuelgue del RPU de agosto -- 0xAAAAAAAA
# tras ~98 minutos asociado y subiendo -- SIGUE SIN ARREGLO. La recuperacion del
# driver no es la solucion. Lo que queda por probar es recuperacion a nivel de
# aplicacion: detectar el enlace muerto y reiniciar el aparato, que es tosco
# pero se sabe que funciona porque el parche del nRF70 carga bien al arrancar.
# Y ahora hay un atenuante real: con la radio bajo demanda ya no esta asociada
# 24 h al dia, asi que la ventana para colgarse es mucho mas corta.
#
# Para reintentar en el futuro (nRF70 con otro NCS, u otra placa): subir
# LOW_POWER a 'y' y correr el gate de asociacion. El script esta en el historial
# de esta sesion; son diez ciclos de AT+STA=off/on, que hacen net_if_down() y
# por tanto arranque en frio del RPU con recarga del parche.
CONFIG_NRF_WIFI_LOW_POWER=n

# El modo punto de acceso se va: decision de seguridad del Doc 14 §2 (SSID y
# contrasena identicos en las 100 unidades) y ademas libera FLASH que hace
# falta para la criptografia.
