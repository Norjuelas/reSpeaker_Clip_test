# TLS recortado al mínimo que sirve para hablar con nuestro propio servicio.
#
# Esto NO es una config de propósito general: sólo negocia con un servidor que
# controlamos nosotros, así que se puede tirar todo lo que existe por
# compatibilidad con la web pública. Con la FLASH al 97% no hay otra opción —
# un TLS por defecto cuesta ~45KB y sólo quedan ~27KB.
#
# La criptografía ya estaba compilada: el supplicant WPA2 arrastra PSA con ECC,
# AES y SHA-256. Lo que se añade aquí es la capa de protocolo, no los algoritmos.

CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_X509_LIBRARY=y
CONFIG_MBEDTLS_SSL_CLI_C=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y

# Somos cliente y nada mas. El lado servidor entra por defecto y no lo usamos.
CONFIG_MBEDTLS_SSL_SRV_C=n

# Un solo intercambio de claves. ECDHE-ECDSA con P-256: sin RSA en ninguna
# parte, que es lo que más pesa en X.509 y en el handshake.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# 4KB por sentido en vez de los 16KB por defecto: 24KB de RAM que no tenemos.
# Obliga al servidor a no mandar registros mayores; el nuestro obedece.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# Nada de reanudación de sesión ni SNI: un solo servidor, siempre el mismo.
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=n

# El handshake pide bastante más montón que los 1024 bytes que bastaban para
# la criptografía suelta del supplicant.
CONFIG_MBEDTLS_HEAP_SIZE=16384

# --- Segundo recorte, tras medir -------------------------------------------
# La primera medición desbordó por 17 688 B. El diff contra el build base
# reveló que Kconfig había metido por defecto un montón de cosas que no
# usamos. Nada de esto hace falta para hablar con nuestro propio servicio.

# Tres intercambios de claves PSK que no negociamos jamás.
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA_ENABLED=n
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=n

# Listas de revocación y peticiones de firma: el device sólo valida una cadena
# que ya lleva embebida. No parsea CRLs ni emite CSRs.
CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_PARSE_C=n

# Guardar y restaurar sesiones TLS entre reinicios: no lo usamos.
CONFIG_MBEDTLS_SSL_CONTEXT_SERIALIZATION=n

# Conservar el certificado del servidor tras el handshake: sólo sirve para
# inspeccionarlo después, cosa que no hacemos.
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n

# Exportar el material de claves (para descifrar capturas). Fuera.
CONFIG_MBEDTLS_SSL_EXPORT_KEYS=n

# El texto de cada alerta posible. (encrypt-then-MAC no se puede desactivar:
# Kconfig no lo expone, lo fija la librería.)
CONFIG_MBEDTLS_SSL_ALL_ALERT_MESSAGES=n
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=n

# Un solo conjunto de cifrado a ofrecer.
CONFIG_NET_SOCKETS_TLS_MAX_CIPHERSUITES=2

# --- Sin Bluetooth ----------------------------------------------------------
# El motivo no es la FLASH: el device solo debe poder manipularse por cable o
# por WiFi con las metodologias aprobadas, y un canal de radio abierto sin
# autenticar es superficie de ataque en 100 devices desplegados. Que ademas
# libere los ~15KB que faltaban para TLS es una coincidencia afortunada.
#
# Se pierde el canal AT por BLE y con el las SDKs moviles de mobile/. Quedan el
# cable USB CDC y WiFi. El modo AP deberia irse por la misma razon, pero eso
# sigue pendiente. Ver Doc 14 §2.
#
# Reversible: CONFIG_BT=y devuelve ble.c y transport_ble.c sin tocar ningun
# sitio de llamada (los stubs estan en src/ble_stub.c). Ver Doc 14.
CONFIG_BT=n

# El host BT traia consigo el soporte de pares de claves ECC (lo usa para su
# propio emparejamiento) y ECDHE-ECDSA dependia de el sin que se notara. Al
# sacar BT, mbedTLS falla con "not all prerequisites". Se piden explicitamente:
# el device necesita importar la clave publica del servidor y derivar la
# efimera del handshake. (BASIC no se pone: Kconfig lo deriva de estos.)
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# El OTA por BLE se va con BLE. Consecuencia que conviene tener presente: la
# unica via de actualizacion que queda es el cable USB (recovery serie de
# MCUboot). Para 100 devices en campo eso no es sostenible, y el sustituto
# natural es un OTA por HTTP sobre esta misma conexion — el device ya sabe
# hablar con el servicio. Ver Doc 14.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=n
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=n
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=n

# Y encender el cliente TLS en el codigo de subida.
CONFIG_CLIP_UPLOAD_TLS=y

# Sin esto el device no sabe decodificar un certificado PEM. Y el fallo no lo
# dice: mbedTLS no parsea el certificado, setsockopt(TLS_SEC_TAG_LIST) devuelve
# EINVAL, y connect() acaba dando EHOSTUNREACH — un error de red para un
# problema de formato de fichero. Costo un rato de diagnostico.
#
# Son ~2KB. La alternativa era exigir DER, que el codigo tambien acepta, pero
# PEM es lo que sale de openssl y lo que cualquiera tiene a mano.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# La capa de cifrado de mbedTLS. Solo se activa sola con la criptografia legacy,
# que aqui no se usa — con PSA hay que pedirla a mano.
#
# Sin ella el ClientHello sale SIN NINGUN conjunto de cifrado: el servidor
# responde 'no shared cipher' y manda una alerta fatal, que en el device
# aparece como -0x7780 y, mas arriba, como un connect() fallido. Se probaron
# tres redes distintas buscando un problema de conectividad que no existia.
CONFIG_MBEDTLS_CIPHER_C=y

# AES y GCM en la capa legacy de mbedTLS. Se apagan solos con PSA
# (default y if !MBEDTLS_USE_PSA_CRYPTO), y ahi esta la trampa: PSA aporta el
# algoritmo, pero la lista de conjuntos de cifrado del ClientHello se construye
# con los simbolos legacy. Sin ellos el device dice literalmente que no soporta
# ninguno, y el servidor contesta 'no shared cipher'.
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_GCM_C=y
