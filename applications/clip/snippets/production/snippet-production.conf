# Production firmware: disable debug UART + UART logging to save power.
# The UART console keeps the UARTE active at idle (~570µA leak); disabling
# it (console + UART log backend) lets the production build reach ~170µA idle.
# Build: west build ... -- -DSNIPPET_ROOT=applications/clip -DSNIPPET=production applications/clip
#
# NOTE: do NOT override app-only Kconfig symbols (CLIP_*) here. A snippet's
# EXTRA_CONF_FILE is broadcast to every sysbuild image, including mcuboot,
# where CLIP_* symbols are undefined (Kconfig abort). The FS log default is
# instead coupled to LOG_BACKEND_UART in Kconfig: setting it 'n' here makes
# CLIP_LOG_FS_DEFAULT_ON default to 'n' for the app image automatically.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
# Production: lock pairing — a new phone may NOT overwrite the existing bond;
# the owner must AT+PAIR=reset first. (Debug builds leave this on for testing.)
#
# TEMPORARILY DISABLED (2026-08-10). This snippet is currently the only way to
# fit the image (the nRF70 firmware had to be embedded again — see prj.conf),
# so it is being used for development, not just for shipping. With pairing
# locked, a reflash strands the host holding a bond the device no longer has:
# macOS then refuses to connect with "Peer removed pairing information", and
# since AT commands only travel over BLE, that locks us out of the device
# entirely. Restore this line once the J-Link lets us go back to a debug build.
# CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
