# Radios de vuelta, SOLO para desarrollo.
#
#   west build --build-dir build-dev --board clip/nrf5340/cpuapp applications/clip \
#     -- -DEXTRA_CONF_FILE=$(pwd)/applications/clip/overlay-dev-radio.conf
#
# Devuelve BLE (canal AT por Bluetooth, SDKs de mobile/, OTA por BLE) y el modo
# punto de acceso. Una imagen construida con esto NO es desplegable en tienda:
# son dos canales de radio sin autenticar, y el modo AP levanta un SSID con la
# misma contrasena en todas las unidades.
#
# Si esta imagen acaba en un device de campo, la afirmacion "el device no tiene
# canales de radio sin autenticar" del informe de seguridad deja de ser cierta.
# Marca el device y reflashealo antes de devolverlo al inventario.

CONFIG_BT=y
CONFIG_NRF70_AP_MODE=y

# TLS no cabe junto a BLE: el presupuesto de FLASH no da para las dos cosas
# (TLS recortado son ~38KB y BLE ~15KB sobre una imagen que iba al 97%). Una
# imagen de desarrollo con radio, por tanto, sube el audio SIN cifrar en
# transito. Otra razon para no sacarla del banco.
CONFIG_CLIP_UPLOAD_TLS=n
