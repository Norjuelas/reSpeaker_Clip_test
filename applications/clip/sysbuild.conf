# Relocate the nRF70 WiFi FW patch to external flash (nrf70_wifi_fw partition,
# MCUboot image 2) so the ~87KB patch is not linked into the internal app image.
# Paired with CONFIG_NRF_WIFI_PATCHES_EXT_FLASH_STORE=y in prj.conf and the
# mcuboot_primary_2 / mcuboot_secondary_2 partitions in pm_static.
SB_CONFIG_WIFI_PATCHES_EXT_FLASH_STORE=y
