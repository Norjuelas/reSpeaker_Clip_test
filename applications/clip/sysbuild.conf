# Keep the nRF70 patch out of the internal image (~87KB).
#
# This symbol is what makes the app read the patch from nrf70_fw_partition —
# setting CONFIG_NRF_WIFI_PATCHES_EXT_FLASH_STORE in prj.conf alone does not
# work, sysbuild propagates its own value and overrides it.
#
# It normally also pushes MCUBOOT_UPDATEABLE_IMAGES to 3, which produces images
# the deployed bootloader rejects. The board's Kconfig.sysbuild pins the count
# at 2 to stop that: the partition exists and is read, but MCUboot does not
# manage it. The application provisions its contents from the SD card instead.
# See applications/clip/src/nrf70_fw_provision.c and Doc 07.
SB_CONFIG_WIFI_PATCHES_EXT_FLASH_STORE=y
