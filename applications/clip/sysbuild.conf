# sysbuild.conf - System build configuration for dual-core MCUboot DFU
#
# This configuration enables OTA updates for both application core and network core
# using external SPI Flash (PY25Q64H 64MB on SPI3)

# Enable MCUboot bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Configure project to use external SPI flash for DFU secondary partition
# The external flash (PY25Q64H) is connected via SPI3, not QSPI
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
# For SPI flash, override external driver check is required
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# Network core IPC radio configuration
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y

# Add network core (b0n) image for secure boot
SB_CONFIG_SECURE_BOOT_NETCORE=y

# Set up dual-image MCUboot (app + netcore)
# - Image 0: App (primary: internal flash, secondary: ext flash)
# - Image 1: Network core (primary: RAM flash, secondary: ext flash)
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=2

# Add support to netcore for DFU
SB_CONFIG_NETCORE_APP_UPDATE=y

# Add support to mcuboot for updating two cores simultaneously
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=y

# Simultaneous FOTA does not support rollback (overwrite-only mode)
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# ==============================================================================
# WiFi nRF7002 Configuration
# ==============================================================================
# Enable nRF7002 WiFi module
SB_CONFIG_WIFI_NRF70=y

# Boot signature key (RSA-2048, from mcuboot)
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APPLICATION_CONFIG_DIR}/sysbuild/root-rsa-2048.pem"
