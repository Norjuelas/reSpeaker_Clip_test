# Static Partition Manager configuration for Clip nRF5340
# 2-image MCUboot: App core + Network core
# WiFi firmware stored in internal flash (not ext flash)
#
# Internal flash layout (1MB = 1024KB total):
#   0x000000 - 0x015fff : mcuboot (88KB)
#   0x016000 - 0xfffff  : mcuboot_primary / app (936KB = 0xea000)
#   88 + 936 = 1024KB (full 1MB utilized)
#
# External flash layout:
#   0x000000 - 0x0effff : mcuboot_secondary (app OTA slot, 960KB=15x64KB, 64KB-aligned)
#   0x0f0000 - 0x12ffff : mcuboot_secondary_1 (netcore OTA slot, 256KB=4x64KB, 64KB-aligned)
#   0x130000 - end      : lfs-storage (LittleFS for config, ~6.8MB=109x64KB, 64KB-aligned)

# ============================================================
# Internal flash (flash_primary)
# ============================================================
mcuboot:
  address: 0x0
  size: 0x16000
  region: flash_primary

mcuboot_pad:
  address: 0x16000
  size: 0x200
  region: flash_primary

app:
  address: 0x16200
  size: 0xe9e00
  region: flash_primary

mcuboot_primary:
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001
  address: 0x16000
  size: 0xea000
  region: flash_primary

mcuboot_primary_app:
  orig_span: &id002
  - app
  span: *id002
  address: 0x16200
  size: 0xe9e00
  region: flash_primary

# ============================================================
# RAM flash (for netcore primary slot)
# ============================================================
mcuboot_primary_1:
  address: 0x0
  size: 0x40000
  device: flash_ctrl
  region: ram_flash

# ============================================================
# External flash (PY25Q64H) -- DFU secondary slots only
# ============================================================

# DFU secondary slot for app (image 0) -- 960KB = 15x64KB, clip.signed.bin fits (892136B < 983040B)
# NOTE: 64KB-aligned (external flash page=64KB), rounded UP from mcuboot_primary (0xe8000).
mcuboot_secondary:
  address: 0x0
  size: 0xf0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# DFU secondary slot for netcore (image 1) -- 256KB = 4x64KB, ipc_radio.bin fits (173256B < 262144B)
mcuboot_secondary_1:
  address: 0xf0000
  size: 0x40000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# LittleFS storage partition on external flash (shrunk 384KB at the end to make
# room for the nRF70 FW patch MCUboot image 2; start kept at 0x130000 so
# existing device config/bonds survive)
lfs_storage:
  address: 0x130000
  size: 0x670000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# nRF70 WiFi FW patch in external flash, NOT as an MCUboot image.
#
# The obvious route (SB_CONFIG_WIFI_PATCHES_EXT_FLASH_STORE) turns this into
# MCUboot image 2, which needs MCUBOOT_UPDATEABLE_IMAGES=3 — and the bootloader
# already flashed on every device only handles 2. Updating it needs SWD, and the
# case is sealed. See Doc 07.
#
# But nrf70_fw_ext reads the patch with plain flash_area_read() on
# FIXED_PARTITION_ID(nrf70_fw_partition). Nothing requires that partition to be
# an MCUboot image — that only governs how it gets *updated*. So the partition
# stays and the MCUboot wrapper goes away: the app provisions the contents
# itself from the SD card (see nrf70_fw_provision.c), which frees ~87KB of
# internal flash on hardware we cannot reflash.
nrf70_wifi_fw:
  address: 0x7a0000
  size: 0x20000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
