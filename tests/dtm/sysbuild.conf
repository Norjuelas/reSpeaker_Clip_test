# BLE Direct Test Mode (RF cert) — flashed directly, no MCUboot bootloader.
# Keeps the remote_shell netcore image (see Kconfig.sysbuild).
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_SECURE_BOOT_NETCORE=n
# Disable the Partition Manager so this no-mcuboot image links at 0x0 instead of
# inheriting the board pm_static (which reserves 0x0 for mcuboot -> app@0x16200,
# 0x0 empty -> no boot). Matches Nordic's bluetooth/direct_test_mode sample.
SB_CONFIG_PARTITION_MANAGER=n
