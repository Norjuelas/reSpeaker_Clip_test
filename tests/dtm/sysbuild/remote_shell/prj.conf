#
# Remote shell configuration for DTM on Clip board
# Bridges IPC from cpunet DTM to physical UART on cpuapp
#

CONFIG_STDOUT_CONSOLE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y

CONFIG_NRFX_UARTE=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

# Config logger
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_REMOTE_SHELL_TX_RING_BUFFER_SIZE=1024

# Required to power up the network core
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
