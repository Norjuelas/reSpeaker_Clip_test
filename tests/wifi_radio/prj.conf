# WiFi radio test
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_RADIO_TEST=y
CONFIG_NRF70_SR_COEX=y
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# 64K memory needed for IQ sample captures
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=78304
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_GETOPT=y
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024

# Debug
CONFIG_STACK_SENTINEL=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y

# Disable unused reSpeaker Clip module defaults (OLED, button) for this test.
# NOTE: do not disable MFD / REGULATOR / PM_DEVICE globally here — the nRF70
# WiFi/QSPI stack transitively depends on them, and doing so silently forces
# WIFI_NRF70=n (→ NRF70_RADIO_TEST=n → conf_params compile error).
CONFIG_OLED_DISPLAY=n
CONFIG_GPIO_BUTTON=n
CONFIG_GPIO=y

