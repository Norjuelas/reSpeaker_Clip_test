# Test/factory firmware — flashed directly via J-Link, no MCUboot bootloader.
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE=""
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
SB_CONFIG_SECURE_BOOT_NETCORE=n
# Disable the Partition Manager so this image does NOT inherit the board-level
# pm_static_clip_nrf5340_cpuapp.yml (which reserves 0x0 for an 88KB mcuboot and
# would link this no-mcuboot app at 0x16200, leaving 0x0 empty -> no boot).
# With PM off, the app links at the flash_primary base (0x0) per the devicetree
# partitions. This is the same pattern Nordic's BLE DTM (RF cert) sample uses.
SB_CONFIG_PARTITION_MANAGER=n
