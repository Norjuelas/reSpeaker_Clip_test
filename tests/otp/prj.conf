# nRF70 OTP Programming Tool

CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_RADIO_TEST=y
CONFIG_NRF70_SR_COEX=y

# Networking required by WIFI_NRF70 selects
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_SOCKETS=y

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=78304

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_DEVICE_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=4096

# No BLE
CONFIG_BT=n

# Minimal networking
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_BUF_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=1
CONFIG_NET_PKT_RX_COUNT=1
