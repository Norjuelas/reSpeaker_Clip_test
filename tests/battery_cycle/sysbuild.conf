# Battery charge/discharge cycle test firmware — flashed directly via J-Link,
# no MCUboot bootloader. (Ported from the re-discharge branch's tests/re.)
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_SECURE_BOOT_NETCORE=n

# Disable the Partition Manager so this no-mcuboot image links at 0x0 instead
# of inheriting the board pm_static (which reserves 0x0 for mcuboot ->
# app@0x16200, 0x0 empty -> no boot). Same pattern as the other clip tests.
SB_CONFIG_PARTITION_MANAGER=n

# Enable WiFi nRF70 (the discharge TX load) + the NET core BLE HCI IPC.
SB_CONFIG_WIFI_NRF70=y
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
