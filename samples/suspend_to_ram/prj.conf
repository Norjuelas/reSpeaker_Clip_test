# SPDX-License-Identifier: Apache-2.0
#
# PMIC + SoC suspend-to-RAM test for nRF5340 on ReSpeaker Clip.
# No nRF7002 / MPSL / BT / WiFi stack.

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y

# PMIC control (nPM1300)
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

# Bluetooth Low Energy advertising
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Clip"

# Indicator GPIO + boot serial
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3

# SPI for SD card
CONFIG_SPI=y

# SD card + FAT filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# Disable everything else
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_WIFI_NRF70=n
CONFIG_DISPLAY=n
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
CONFIG_SENSOR=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_INPUT=n
CONFIG_USB_DEVICE_STACK=n

# ReSpeaker Lav module defaults; override here for this sample
CONFIG_OLED_DISPLAY=n
CONFIG_GPIO_BUTTON=n
