#
# PMIC + SoC suspend-to-RAM test for nRF5340 on reSpeaker Clip.
# No nRF7002 / WiFi stack (the wlan0 node is disabled in the overlay).
# BLE advertising is used as a suspend indicator.
# Builds under MCUboot like the other samples; the external SPI flash stays
# in the partition layout (mcuboot's secondary slot) but its driver/bus are
# disabled here and the rail is power-gated at runtime.

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y

# PMIC control (nPM1300) — rail power-gating
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

# Bluetooth Low Energy advertising (suspend indicator)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Clip"

# Indicator GPIO + console
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# SPI for SD card (SPI4)
CONFIG_SPI=y

# SD card + FAT filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# Flash: keep the partition map (mcuboot slot layout) but no external SPI
# flash driver — the external flash bus/rail are disabled in the overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=n

# Disable unused reSpeaker Clip module defaults for this sample
CONFIG_OLED_DISPLAY=n
CONFIG_GPIO_BUTTON=n
CONFIG_SENSOR=n
CONFIG_INPUT=n
