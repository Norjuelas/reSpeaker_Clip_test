sample:
  description: WiFi AP + iperf throughput test sample for reSpeaker Clip
  name: WiFi AP + iperf
common:
  build_only: true
  integration_platforms:
    - clip/nrf5340/cpuapp
tests:
  sample.wifi_ap_iperf:
    tags:
      - wifi
      - network
      - iperf
      - throughput
    harness: console
    harness_config:
      type: one_line
      regex:
        - "WiFi AP + iperf Sample"
