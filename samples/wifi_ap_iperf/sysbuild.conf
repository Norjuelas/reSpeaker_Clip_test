#
# MCUboot sysbuild configuration for WiFi samples
#
# Build: west build --build-dir build-<sample> --board clip/nrf5340/cpuapp samples/<sample>

# MCUboot bootloader
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# External SPI flash for DFU secondary partition
SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
SB_CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# Dual-image MCUboot (app + netcore)
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=2
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=y
SB_CONFIG_NETCORE_APP_UPDATE=y

# Overwrite-only mode (no rollback)
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Network core IPC radio (BLE controller for coexistence arbitration)
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y

# Secure boot for network core
SB_CONFIG_SECURE_BOOT_NETCORE=y

# WiFi nRF70 (required for nRF7002)
SB_CONFIG_WIFI_NRF70=y

# Signing key (must match the key used to build MCUboot on the device)
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APPLICATION_CONFIG_DIR}/sysbuild/root-rsa-2048.pem"
