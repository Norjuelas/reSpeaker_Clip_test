#
# WiFi AP + iperf Sample Configuration for ReSpeaker Clip
# WiFi-only (no BLE)
#

# =============================================================================
# WiFi Core Configuration
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_AP_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=n
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y
CONFIG_NRF_WIFI_IF_AUTO_START=y

# =============================================================================
# zperf Configuration (Network Throughput Testing)
# =============================================================================
CONFIG_NET_ZPERF=y
# Note: Client mode is enabled by default with NET_ZPERF=y

# =============================================================================
# Networking Stack
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
# TCP not needed for UDP iperf; disable to save flash
CONFIG_NET_TCP=n

# Network buffers - tuned for AP mode with throughput testing
CONFIG_NET_PKT_RX_COUNT=3
CONFIG_NET_PKT_TX_COUNT=3
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=2

# Memory configuration for WiFi AP + zperf
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000
CONFIG_NRF70_RPU_PS_IDLE_TIMEOUT_MS=3600000

CONFIG_WIFI_CREDENTIALS=n

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_CONTEXT_SYNC_RECV=y

# CONFIG_INIT_STACKS=n  # Disable to save FLASH
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=4

# =============================================================================
# Static IP Configuration for AP
# =============================================================================
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.4.1"

# =============================================================================
# DHCP Server - client gets 192.168.4.2
# =============================================================================
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1

# =============================================================================
# Memory Configuration
# =============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# Thread stack for WiFi operations - increased to prevent stack overflow
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240

# mbedtls heap
CONFIG_MBEDTLS_HEAP_SIZE=1024

# System heap - increased for zperf
CONFIG_HEAP_MEM_POOL_SIZE=80000

# =============================================================================
# System Configuration
# =============================================================================
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MAX_LEVEL=3

# =============================================================================
# Hardware Drivers
# =============================================================================
CONFIG_GPIO=y
# Disable unused clip board drivers
CONFIG_OLED_DISPLAY=n
CONFIG_DISPLAY=n
CONFIG_MFD_NPM13XX=n
CONFIG_GPIO_NPM13XX=n
CONFIG_REGULATOR_NPM13XX=n

# Hardware info for chip ID (used for unique SSID)
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=n

# =============================================================================
# Shell Configuration
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=5200
# NET_SHELL pulls in many net subsystems; disable to save flash
# CONFIG_NET_SHELL is not set
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_GETOPT=y

# =============================================================================
# Kernel Options
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_TIMERS=y

# =============================================================================
# Network Management
# =============================================================================
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# Increase timeout for crowded environments
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# =============================================================================
# WiFi Configuration
# =============================================================================
# Random MAC address
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# Network statistics and filesystem not needed in this sample
# CONFIG_NET_STATISTICS is not set
# CONFIG_FILE_SYSTEM is not set
