#
# WiFi AP + BLE Coexistence Test Sample
# Based on wifi_ap_iperf (known-working WiFi AP) + minimal BLE advertising
#
# Goal: verify WiFi AP (5GHz ch36) and BLE can coexist on the Clip board.
# Use shell commands to start/stop WiFi and BLE independently.
#

# =============================================================================
# BLE
# =============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ClipCoex"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Fix BLE crash with coex enabled (net core must disable NRF_RPC)
CONFIG_NRF_RPC=n
CONFIG_NRF_RPC_CBOR=n

# =============================================================================
# WiFi Core (identical to wifi_ap_iperf)
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_AP_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=n

# WiFi/BLE coexistence - MPSL PTA mode.
# NRF70_SR_COEX=y enables PTA handshake between nRF7002 and MPSL (net core).
# NRF70_SR_COEX_RF_SWITCH must stay disabled - no RF switch hardware on this board.
CONFIG_NRF70_SR_COEX=y
CONFIG_NRF_WIFI_IF_AUTO_START=n

# =============================================================================
# Networking (same as wifi_ap_iperf)
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_PKT_RX_COUNT=3
CONFIG_NET_PKT_TX_COUNT=3
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NRF70_RX_NUM_BUFS=4
CONFIG_NRF70_MAX_TX_AGGREGATION=2
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=4

# =============================================================================
# Static IP for AP
# =============================================================================
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.4.1"

# =============================================================================
# DHCP server
# =============================================================================
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1

# =============================================================================
# zperf (WiFi UDP iperf)
# =============================================================================
CONFIG_NET_ZPERF=y
CONFIG_NET_TCP=y

# =============================================================================
# Coex options (used in PTA configuration)
# =============================================================================
CONFIG_COEX_SEP_ANTENNAS=n
CONFIG_SR_PROTOCOL_BLE=y

# =============================================================================
# Memory
# =============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240
CONFIG_MBEDTLS_HEAP_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=120000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048

# =============================================================================
# Shell + Logging
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_GETOPT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MAX_LEVEL=3

# =============================================================================
# System
# =============================================================================
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_TIMERS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# Fixed MAC address
CONFIG_WIFI_FIXED_MAC_ADDRESS="14:5A:FC:5E:37:9C"
