#
# WiFi AP + BLE Coex Sample sysbuild configuration
#

# Enable WiFi nRF70 (required for nRF7002)
SB_CONFIG_WIFI_NRF70=y

# Select ipc_radio as net core image (provides MPSL_CX coexistence arbitration).
# NETCORE_IPC_RADIO has a prompt so it can be set directly in sysbuild.conf.
# This is what tests/clip achieves via Kconfig.sysbuild NRF_DEFAULT_IPC_RADIO=y.
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
