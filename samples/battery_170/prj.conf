# SPDX-License-Identifier: Apache-2.0

# Nordic nRF Fuel Gauge Library
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# I2C and Sensor
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y

# MFD and npm1300 charger/fuel-gauge sensor
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y

# Float printf support (required for fuel gauge)
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=0
CONFIG_LOG_DEFAULT_LEVEL=4

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
