#
# HTTP Server Sample sysbuild configuration
#

# Enable WiFi nRF70 (required for nRF7002)
SB_CONFIG_WIFI_NRF70=y

# Select ipc_radio as net core image (provides BLE coexistence arbitration)
# This is needed for proper WiFi operation on nRF5340 + nRF7002
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
